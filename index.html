<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
  <title>FootyIntel</title>
</head>

<body>
  <div class="controls-bar">
    <h1>⚽Guess the Footballer🏃</h1>
    <button id="theme">🌙</button>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  <h2 id="message">Message</h2>

    <section class="stats">
    <p>Player: <span id="round">1</span></p>
    <p>Score: <span id="score">0</span></p>
    <p>Best: <span id="high-score">0</span></p>
    <p>Lives: <span id="lives">3</span></p>
  </section>

  <ul id="clues"></ul>

  <form id="guess-form">
    <input id="guess" type="text" placeholder="Type the player name..." autocomplete="off">
    <button type="submit" id="guess-btn">Guess</button>
  </form>

  <button id="clue-btn">Next Clue</button>
  <button id="reset">Restart</button>
</body>

</html>
